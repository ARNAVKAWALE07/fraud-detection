name: Fraud Detection CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependences
        run: |
          pip install pytest fastapi httpx sckiti-learn \
          joblib pandas numpy prometheus-client pydantic

      - name: Run test
        run: pytest tests/ -v
      
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD}}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/fraud-detection:latest
